[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/movies/:id"
  to = "/.netlify/functions/movie-details?id=:id"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/movies"
  to = "/.netlify/functions/movies"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
